<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scopewright — Draft your SOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EFE7;
    --paper-line: rgba(28,43,58,0.09);
    --ink:#1C2B3A;
    --ink-soft:#5B6B79;
    --navy-deep:#0F1B26;
    --brass:#B08D57;
    --brass-soft: rgba(176,141,87,0.14);
    --redline:#A63D40;
    --white:#FFFFFF;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 64px;}

  /* Letterhead */
  .letterhead{
    background:var(--navy-deep);
    color:var(--paper);
    padding:40px 24px 34px;
    margin-bottom:36px;
    position:relative;
    overflow:hidden;
  }
  .letterhead::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:3px;
    background:linear-gradient(90deg, var(--brass) 0%, transparent 60%);
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 14px;
  }
  .letterhead h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(34px,5vw,52px);
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  .letterhead p{
    font-family:var(--font-body);
    font-size:15px;
    color:rgba(242,239,231,0.72);
    max-width:520px;
    margin:0;
    line-height:1.5;
  }

  .wrap > .letterhead{max-width:none;margin-left:calc(-50vw + 50%);margin-right:calc(-50vw + 50%);padding-left:calc(50vw - 50% + 24px);padding-right:calc(50vw - 50% + 24px);}

  /* Layout */
  .grid{
    display:grid;
    grid-template-columns: 1fr 1.25fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width: 860px){
    .grid{grid-template-columns:1fr;}
  }

  .card{
    background:var(--white);
    border:1px solid var(--paper-line);
    box-shadow: 0 1px 2px rgba(28,43,58,0.04);
  }

  /* Left: intake pad */
  .pad{padding:26px 26px 24px;}
  .pad .eyebrow{color:var(--ink-soft);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}
  label{
    display:block;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  input[type=text]{
    width:100%;
    border:none;
    border-bottom:1.5px solid var(--paper-line);
    background:transparent;
    font-family:var(--font-body);
    font-size:15px;
    color:var(--ink);
    padding:6px 2px 8px;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type=text]:focus{border-bottom-color:var(--brass);}

  .notes-label{margin-top:4px;}
  textarea{
    width:100%;
    min-height:280px;
    resize:vertical;
    border:1px solid var(--paper-line);
    background:
      repeating-linear-gradient(var(--white) 0 30px, var(--paper-line) 30px 31px);
    background-attachment:local;
    line-height:31px;
    padding:4px 14px 4px;
    font-family:var(--font-body);
    font-size:14.5px;
    color:var(--ink);
    outline:none;
  }
  textarea:focus{border-color:var(--brass);}
  textarea::placeholder{color:#9aa7b2;}

  .hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:10px 0 22px;
    line-height:1.5;
  }

  button.primary{
    font-family:var(--font-mono);
    font-size:12.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:14px 22px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition:background .15s ease, transform .1s ease;
  }
  button.primary:hover{background:var(--navy-deep);}
  button.primary:active{transform:translateY(1px);}
  button.primary:disabled{background:#B7BEC5;cursor:not-allowed;}
  button.primary .arrow{color:var(--brass);}

  .error-msg{
    margin-top:14px;
    font-size:13px;
    color:var(--redline);
    font-family:var(--font-body);
  }

  /* Right: document */
  .doc-outer{position:relative;}
  .doc{
    padding:38px 40px 42px;
    min-height:420px;
    position:relative;
  }
  .stamp{
    position:absolute;
    top:26px; right:34px;
    border:2px solid var(--brass);
    color:var(--brass);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:6px 10px;
    transform:rotate(-7deg);
    opacity:0.85;
    pointer-events:none;
  }
  .doc-empty{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    min-height:420px;
    color:var(--ink-soft);
  }
  .doc-empty .glyph{
    font-family:var(--font-display);
    font-size:44px;
    color:var(--brass-soft);
    margin-bottom:6px;
  }
  .doc-empty p{max-width:340px;font-size:14px;line-height:1.6;margin:0;}

  .doc-title{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    margin:0 0 4px;
    padding-right:110px;
  }
  .doc-meta{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:26px;
  }

  .clause{margin-bottom:22px;opacity:0;transform:translateY(6px);animation:rise .4s ease forwards;}
  @media (prefers-reduced-motion: reduce){.clause{animation:none;opacity:1;transform:none;}}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}

  .clause h3{
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:0.03em;
    color:var(--navy-deep);
    margin:0 0 8px;
    display:flex;
    gap:10px;
    align-items:baseline;
  }
  .clause h3 .num{color:var(--brass);font-weight:600;}
  .clause p{font-size:14.5px;line-height:1.65;margin:0 0 6px;color:var(--ink);}
  .clause ol{margin:0;padding-left:0;list-style:none;}
  .clause ol li{
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink);
    padding-left:30px;
    position:relative;
    margin-bottom:6px;
  }
  .clause ol li .sub-num{
    position:absolute;left:0;top:0;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-soft);
  }
  .clause.timeline table{width:100%;border-collapse:collapse;margin-top:4px;}
  .clause.timeline th{
    text-align:left;font-family:var(--font-mono);font-size:10.5px;
    text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);
    border-bottom:1px solid var(--paper-line);padding:6px 10px 6px 0;
  }
  .clause.timeline td{
    font-size:14px;padding:9px 10px 9px 0;border-bottom:1px solid var(--paper-line);
    vertical-align:top;
  }

  .doc-actions{
    display:flex;gap:10px;margin-top:8px;padding:0 40px 26px;
  }
  .ghost-btn{
    font-family:var(--font-mono);
    font-size:11.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--paper-line);
    color:var(--ink-soft);
    padding:9px 14px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .ghost-btn:hover{border-color:var(--brass);color:var(--ink);}

  footer{
    margin-top:40px;
    font-family:var(--font-mono);
    font-size:11px;
